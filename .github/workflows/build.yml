name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test tests/WindowsTuner.Tests -c Release

      - name: Publish (win-x64, single file)
        run: >
          dotnet publish src/WindowsTuner.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o publish/win-x64

      - name: Publish (win-arm64, single file)
        run: >
          dotnet publish src/WindowsTuner.App -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o publish/win-arm64

      - name: Smoke test (opens every page on real Windows, saves screenshots)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $p = Start-Process -FilePath publish/win-x64/WindowsTuner.exe -ArgumentList '--smoke' -PassThru -Wait
          $log = Join-Path $env:LOCALAPPDATA 'WindowsTuner/Logs/smoke.log'
          if (Test-Path $log) { Get-Content $log }
          Copy-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA 'WindowsTuner/Logs') smoke-logs -ErrorAction SilentlyContinue
          Write-Host "Exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTuner-win-x64
          path: publish/win-x64/WindowsTuner.exe

      - name: Upload app (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTuner-win-arm64
          path: publish/win-arm64/WindowsTuner.exe

      - name: Upload smoke-test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke-logs/
          if-no-files-found: ignore

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item publish/win-x64/WindowsTuner.exe WindowsTuner-x64.exe
          Copy-Item publish/win-arm64/WindowsTuner.exe WindowsTuner-arm64.exe

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WindowsTuner-x64.exe
            WindowsTuner-arm64.exe
          generate_release_notes: true
